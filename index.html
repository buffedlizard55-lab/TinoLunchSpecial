<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tino Lunch Special - Cupertino lunch specials</title>
<meta name="description" content="Cupertino-first lunch specials master list with hours, prices, evidence tiers, source links, and irregularity flags." />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1>Tino Lunch Special</h1>
    <p class="sub" id="subtitle">Loading the verified data...</p>
    <div class="chips" id="headline-chips"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <div class="wrap" role="tablist">
      <button class="tab is-active" role="tab" aria-selected="true" data-tab="overview">Overview</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="lunch">Lunch specials</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="flags">Flags <span class="count" id="flag-count"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="sources">Sources</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="method">Method</button>
    </div>
  </nav>
</header>

<main class="wrap" id="main">
  <section class="panel is-active" id="panel-overview"></section>
  <section class="panel" id="panel-lunch"></section>
  <section class="panel" id="panel-flags"></section>
  <section class="panel" id="panel-sources"></section>
  <section class="panel" id="panel-method"></section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p id="footer-note"></p>
    <p class="tiny">Lunch data comes from restaurant websites, published menus, Yelp, Google-derived listings, and other source pages linked per row. Nothing here is invented: rows that could not be verified say so.</p>
  </div>
</footer>

<script src="data/generated.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
