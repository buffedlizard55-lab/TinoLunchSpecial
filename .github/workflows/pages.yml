name: GitHub Pages

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the browser bundle
        run: python3 scripts/build_data.py
      - name: Stage only the files Pages should serve
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp assets/styles.css assets/app.js _site/assets/
          cp data/generated.js _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
