name: Deploy GitHub Pages

on:
  push:
    # main is the default branch; the arena/* branch is where this session's work lands.
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild and validate the data files
        run: python3 scripts/build_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render every panel headlessly
        run: node scripts/smoke_test.js

      - name: Check every source link is a real URL
        run: python3 scripts/check_links.py

      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp assets/styles.css assets/app.js _site/assets/
          cp data/generated.js data/summary.md _site/data/
          cp data/*.json _site/data/
          echo "build: $GITHUB_SHA  $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/build-info.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: out
